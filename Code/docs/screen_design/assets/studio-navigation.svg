<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title id="title">Studio 화면 전환도</title>
  <desc id="desc">TraceWave Studio 화면 설계안. 기능별 번호는 화면 명세 표와 연결된다. 실제 실행 화면 또는 검증 결과가 아니다.</desc>
  <rect width="100%" height="100%" fill="#F3F5F8" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536174" />
    </marker>
  </defs>
  <rect x="32" y="20" width="1536" height="44" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="44" y="42.0" fill="#243247">Studio 화면 전환도</text>
  <rect x="32" y="64" width="1536" height="42" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="85.0" fill="#536174">실선은 사용자 동작입니다. 화면 이동만으로 적용 / 계산 / 취소를 실행하지 않는 목표 계약입니다.</text>
  <rect x="32" y="950" width="1536" height="32" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="966.0" fill="#536174">화면 설계안 v0.1 / 2026-11-16 KST / 구현 및 사용성 수용과 별도 / 치수와 성능 예시 없음</text>
  <rect x="40" y="150" width="280" height="100" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="184.6" fill="#243247">S00 시작 / 복구</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="215.39999999999998" fill="#243247">새 프로젝트 또는 열기</text>
  <rect x="410" y="150" width="1140" height="100" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="422" y="183.2" fill="#243247">공통 프레임: 프로젝트 / 저장 상태 / 선택 / 작업 알림</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="422" y="216.79999999999998" fill="#243247">설계 - 해석 - 결과 - 비교 - 출력 탭은 언제든 이동 가능</text>
  <polyline stroke-width="2" points="320,200 410,200" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="40" y="360" width="270" height="120" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="403.9" fill="#243247">S10 설계</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="436.09999999999997" fill="#243247">S11 2D / S12 3D</text>
  <polyline stroke-width="2" points="520,250 520,300 175,300 175,360" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="350" y="360" width="270" height="120" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="362" y="403.9" fill="#243247">S20 해석</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="362" y="436.09999999999997" fill="#243247">입력 검사 / 실행</text>
  <polyline stroke-width="2" points="485,250 485,360" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="660" y="360" width="270" height="120" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="672" y="403.9" fill="#243247">S30 결과</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="672" y="436.09999999999997" fill="#243247">실행 선택 / 근거</text>
  <polyline stroke-width="2" points="795,250 795,360" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="970" y="360" width="270" height="120" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="982" y="403.9" fill="#243247">S40 비교</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="982" y="436.09999999999997" fill="#243247">조건 정렬 / 측정</text>
  <polyline stroke-width="2" points="1105,250 1105,360" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="1280" y="360" width="270" height="120" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1292" y="403.9" fill="#243247">S50 출력</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1292" y="436.09999999999997" fill="#243247">계획 / 생성 / 검수</text>
  <polyline stroke-width="2" points="1415,250 1415,360" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="40" y="550" width="580" height="160" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="600.6" fill="#243247">D10 목표 / D11 문헌과 후보</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="630.0" fill="#243247">D12 기판과 재료 / D13 적층과 환경</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="659.4" fill="#243247">D14 제약과 DRC / D15 이름 변경</text>
  <polyline stroke-width="2" points="175,480 175,550" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="660" y="550" width="890" height="160" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="672" y="599.2" fill="#243247">P10 문제 -&gt; 해당 객체 / 필드로 이동</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="672" y="630.0" fill="#243247">P11 작업 -&gt; 실행 개정 / 취소 요청 / 결과 열기</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="672" y="660.8000000000001" fill="#243247">완료와 실패는 알림으로 전달, 현재 편집 문맥 유지</text>
  <rect x="40" y="780" width="1510" height="110" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="820.3" fill="#243247">공통 전환 규칙</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="21" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="52" y="849.6999999999999" fill="#243247">미적용 초안이 영향받으면 적용 / 버리기 / 머무르기. 결과 불명은 재조회 후 해제. Esc는 해석 취소가 아님.</text>
</svg>