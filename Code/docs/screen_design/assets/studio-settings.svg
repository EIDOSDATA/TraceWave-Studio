<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title id="title">D10-D15 / 설정과 이름 변경</title>
  <desc id="desc">TraceWave Studio 화면 설계안. 기능별 번호는 화면 명세 표와 연결된다. 실제 실행 화면 또는 검증 결과가 아니다.</desc>
  <rect width="100%" height="100%" fill="#F3F5F8" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536174" />
    </marker>
  </defs>
  <rect x="32" y="20" width="1536" height="44" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="44" y="42.0" fill="#243247">D10-D15 / 설정과 이름 변경</text>
  <rect x="32" y="64" width="1536" height="42" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="85.0" fill="#536174">대화상자 별 세부 필드는 화면 명세 표를 따릅니다. 미적용 입력 / 적용됨 / 저장됨을 구분합니다.</text>
  <rect x="32" y="950" width="1536" height="32" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="966.0" fill="#536174">화면 설계안 v0.1 / 2026-11-16 KST / 구현 및 사용성 수용과 별도 / 치수와 성능 예시 없음</text>
  <rect x="50" y="150" width="730" height="740" rx="6" fill="white" stroke="#D3DBE6" />
  <rect x="70" y="172" width="690" height="50" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="82" y="197.0" fill="#243247">01  설정 제목 / 현재 대상</text>
  <rect x="70" y="240" width="190" height="500" rx="6" fill="#F8FAFC" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="420.0" fill="#243247">02  대상 목록</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="476.0" fill="#243247">현재 선택</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="504.0" fill="#243247">추가</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="532.0" fill="#243247">복제 (후속)</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="560.0" fill="#243247">삭제</text>
  <rect x="280" y="240" width="480" height="100" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="276.0" fill="#243247">03  기본 입력</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="304.0" fill="#243247">필드명 / 값 또는 식 / 단위</text>
  <rect x="280" y="360" width="480" height="100" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="396.0" fill="#243247">04  출처 / 가정 / 미정</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="424.0" fill="#243247">현재 값과 최초 원본을 분리</text>
  <rect x="280" y="480" width="480" height="160" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="518.0" fill="#243247">05  검토 / 미리보기</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="546.0" fill="#243247">변경 대상과 생략 범위</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="574.0" fill="#243247">오류는 해당 필드와 연결</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="602.0" fill="#243247">새 입력이면 기존 검토 무효화</text>
  <rect x="280" y="660" width="480" height="80" rx="6" fill="#F8FAFC" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="292" y="700.0" fill="#243247">06  미적용 입력 있음</text>
  <rect x="70" y="788" width="210" height="60" rx="6" fill="#175CD3" stroke="#175CD3" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="82" y="818.0" fill="white">07  적용</text>
  <rect x="300" y="788" width="210" height="60" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="312" y="818.0" fill="#243247">08  닫기</text>
  <rect x="530" y="788" width="230" height="60" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="542" y="818.0" fill="#243247">도움말 / 출처</text>
  <rect x="820" y="150" width="730" height="740" rx="6" fill="white" stroke="#D3DBE6" />
  <rect x="840" y="172" width="690" height="50" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="852" y="197.0" fill="#243247">D15 / 이름 변경</text>
  <rect x="850" y="252" width="670" height="100" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="286.6" fill="#243247">01  현재 객체: 원호 01</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="317.40000000000003" fill="#243247">현재 도체층: Top Copper</text>
  <rect x="850" y="380" width="670" height="70" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="415.0" fill="#243247">02  표시 이름  [주 방사 원호]</text>
  <rect x="850" y="478" width="670" height="130" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="515.0" fill="#243247">03  같은 종류 이름과 중복이면 안내</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="543.0" fill="#243247">내부 ID와 수식 변수는 바뀌지 않음</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="571.0" fill="#243247">최초 문헌 / 생성 사본을 덮어쓰지 않음</text>
  <rect x="850" y="640" width="670" height="68" rx="6" fill="#F8FAFC" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="674.0" fill="#243247">04  상세 식별자  [펼치기 / 복사]</text>
  <rect x="850" y="788" width="320" height="60" rx="6" fill="#175CD3" stroke="#175CD3" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="862" y="818.0" fill="white">05  변경</text>
  <rect x="1190" y="788" width="330" height="60" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1202" y="818.0" fill="#243247">06  취소</text>
