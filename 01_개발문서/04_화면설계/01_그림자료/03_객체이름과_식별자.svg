<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title id="title">객체 이름과 안정 ID / 선택 연결</title>
  <desc id="desc">TraceWave Studio 화면 설계안. 기능별 번호는 화면 명세 표와 연결된다. 실제 실행 화면 또는 검증 결과가 아니다.</desc>
  <rect width="100%" height="100%" fill="#F3F5F8" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536174" />
    </marker>
  </defs>
  <rect x="32" y="20" width="1536" height="44" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="44" y="42.0" fill="#243247">객체 이름과 안정 ID / 선택 연결</text>
  <rect x="32" y="64" width="1536" height="42" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="85.0" fill="#536174">표시 이름은 사람이 읽고 수정합니다. 내부 ID는 참조와 이력을 연결하며 기본 화면에서 접습니다.</text>
  <rect x="32" y="950" width="1536" height="32" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="966.0" fill="#536174">화면 설계안 v0.1 / 2026-11-16 KST / 구현 및 사용성 수용과 별도 / 치수와 성능 예시 없음</text>
  <rect x="50" y="170" width="450" height="160" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="215.0" fill="#243247">현재 객체</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="250.0" fill="#243247">표시 이름: 주 방사 원호</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="285.0" fill="#243247">불변 ID: 내부 상세에서 확인</text>
  <rect x="570" y="170" width="450" height="160" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="582" y="216.4" fill="#243247">이름 변경 명령</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="582" y="250.0" fill="#243247">원호 01 -&gt; 주 방사 원호</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="582" y="283.6" fill="#243247">한 개정 / 실행 취소 / 저장</text>
  <polyline stroke-width="2" points="500,250 570,250" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="1090" y="170" width="460" height="160" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1102" y="216.4" fill="#243247">변하지 않는 관계</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1102" y="250.0" fill="#243247">레이어 / net / 포트 참조</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1102" y="283.6" fill="#243247">수식 변수와 형상 치수</text>
  <polyline stroke-width="2" points="1020,250 1090,250" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="50" y="450" width="330" height="100" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="500.0" fill="#243247">프로젝트 트리</text>
  <rect x="440" y="450" width="330" height="100" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="452" y="500.0" fill="#243247">2D / 3D 보기</text>
  <rect x="830" y="450" width="330" height="100" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="842" y="500.0" fill="#243247">선택 속성</text>
  <rect x="1220" y="450" width="330" height="100" rx="6" fill="white" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1232" y="500.0" fill="#243247">문제 위치</text>
  <rect x="50" y="610" width="1500" height="90" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="655.0" fill="#243247">선택 문맥 = 프로젝트 + 개정 + 객체 ID + 부분 역할 / 동일 문맥만 동기화</text>
  <polyline stroke-width="2" points="215,550 215,610" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <polyline stroke-width="2" points="605,550 605,610" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <polyline stroke-width="2" points="995,550 995,610" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <polyline stroke-width="2" points="1385,550 1385,610" fill="none" stroke="#536174" marker-end="url(#arrow)" />
  <rect x="50" y="780" width="710" height="110" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="818.9" fill="#243247">문헌 / 생성 당시 사본</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="62" y="851.1" fill="#243247">원문 이름과 원래 입력을 그대로 보존</text>
  <rect x="810" y="780" width="740" height="110" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="822" y="818.9" fill="#243247">과거 snapshot / 완료 결과</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="23" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="822" y="851.1" fill="#243247">당시 이름으로 표시하고 현재 개정과 구분</text>
</svg>