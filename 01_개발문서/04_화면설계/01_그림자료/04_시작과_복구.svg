<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title id="title">S00 / 시작 - 프로젝트와 복구</title>
  <desc id="desc">TraceWave Studio 화면 설계안. 기능별 번호는 화면 명세 표와 연결된다. 실제 실행 화면 또는 검증 결과가 아니다.</desc>
  <rect width="100%" height="100%" fill="#F3F5F8" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536174" />
    </marker>
  </defs>
  <rect x="32" y="20" width="1536" height="44" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="27" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="44" y="42.0" fill="#243247">S00 / 시작 - 프로젝트와 복구</text>
  <rect x="32" y="64" width="1536" height="42" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="85.0" fill="#536174">신규 시작 화면의 제안입니다. 현재 GUI의 생성 / 열기 명령을 단계적으로 연결합니다.</text>
  <rect x="32" y="950" width="1536" height="32" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="15" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="44" y="966.0" fill="#536174">화면 설계안 v0.1 / 2026-11-16 KST / 구현 및 사용성 수용과 별도 / 치수와 성능 예시 없음</text>
  <rect x="60" y="160" width="1480" height="80" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="24" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="72" y="200.0" fill="#243247">TraceWave Studio        새 프로젝트        프로젝트 열기        환경 진단</text>
  <rect x="60" y="270" width="880" height="600" rx="6" fill="white" stroke="#D3DBE6" />
  <rect x="90" y="294" width="800" height="50" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="102" y="319.0" fill="#243247">01  최근 프로젝트</text>
  <rect x="90" y="370" width="800" height="210" rx="6" fill="#F8FAFC" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="middle" x="490.0" y="444.2" fill="#536174">아직 등록된 최근 프로젝트가 없습니다.</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="middle" x="490.0" y="475.0" fill="#536174">프로젝트 이름과 저장 위치부터 지정하세요.</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="22" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="middle" x="490.0" y="505.79999999999995" fill="#536174">물성 / 주파수 / 포트 값은 자동으로 채우지 않습니다.</text>
  <rect x="90" y="630" width="380" height="68" rx="6" fill="#175CD3" stroke="#175CD3" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="102" y="664.0" fill="white">02  빈 프로젝트 만들기</text>
  <rect x="490" y="630" width="400" height="68" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="502" y="664.0" fill="#243247">03  기존 프로젝트 열기</text>
  <rect x="970" y="270" width="570" height="600" rx="6" fill="white" stroke="#D3DBE6" />
  <rect x="1000" y="294" width="510" height="50" rx="6" fill="none" stroke="none" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="25" dominant-baseline="central" font-weight="700" xml:space="preserve" text-anchor="start" x="1012" y="319.0" fill="#243247">04  복구 / 환경 상태</text>
  <rect x="1000" y="370" width="510" height="160" rx="6" fill="#FFF3D6" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="422.0" fill="#243247">복구 후보가 있으면</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="450.0" fill="#243247">정식 저장본 / 후보의 시각과 차이를 표시</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="478.0" fill="#243247">원본을 덮기 전에 선택</text>
  <rect x="1000" y="560" width="510" height="170" rx="6" fill="#EDF4FF" stroke="#D3DBE6" />
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="617.0" fill="#243247">05  CAD / WSL 환경 확인</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="645.0" fill="#243247">환경 미구성 시 편집과 저장 가능</text>
  <text font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" dominant-baseline="central" font-weight="400" xml:space="preserve" text-anchor="start" x="1012" y="673.0" fill="#243247">실행에 필요한 항목만 안내</text>
</svg>