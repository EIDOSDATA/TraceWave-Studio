<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="1600" height="1000" fill="#f2f6fb" /><rect x="65" y="44" width="1470" height="108" fill="#e8f2ff" stroke="#adc5dd" /><rect x="65" y="44" width="5" height="108" fill="#1169d3" /><text x="87" y="80" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">TraceWave Studio / 측정 기록과 비교</text><text x="87" y="110" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">자료 분류, 교정 조건, 수치 차이와 실측 판정을 각각 확인</text><rect x="65" y="205" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="65" y="205" width="5" height="125" fill="#1169d3" /><text x="87" y="241" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">파일과 형식</text><text x="87" y="271" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">Touchstone / CSV / HDF5 원문 선택</text><text x="87" y="301" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">읽을 수 있는 크기와 형식 확인</text><rect x="440" y="205" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="440" y="205" width="5" height="125" fill="#1169d3" /><text x="462" y="241" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">열 / 포트 대응</text><text x="462" y="271" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">주파수 단위 / 포트 / Z0 대응</text><text x="462" y="301" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">기준면 미정값 유지</text><rect x="815" y="205" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="815" y="205" width="5" height="125" fill="#1169d3" /><text x="837" y="241" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">시료와 교정</text><text x="837" y="271" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">시료 / 취득 / 교정 / 설치 / 환경</text><text x="837" y="301" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">불확도와 원문 첨부 연결</text><rect x="1190" y="205" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="1190" y="205" width="5" height="125" fill="#1169d3" /><text x="1212" y="241" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">가져오기 검토</text><text x="1212" y="271" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">실제 곡선과 조건 확인</text><text x="1212" y="301" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">원문과 기록을 한 번에 적용</text><rect x="65" y="415" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="65" y="415" width="5" height="125" fill="#1169d3" /><text x="87" y="451" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">비교 &gt; 측정</text><text x="87" y="481" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">기준과 비교 자료를 명시 선택</text><text x="87" y="511" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">자료와 기록의 개정 고정</text><rect x="440" y="415" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="440" y="415" width="5" height="125" fill="#1169d3" /><text x="462" y="451" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">필요하면 자료 정렬</text><text x="462" y="481" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">포트 순열 / Z0 / 선형 RI</text><text x="462" y="511" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">순서와 보간 지점을 확인</text><rect x="815" y="415" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="815" y="415" width="5" height="125" fill="#1169d3" /><text x="837" y="451" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">복소 차이와 조건</text><text x="837" y="481" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">곡선 / 표본 / 교정과 시료 차이</text><text x="837" y="511" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">비교 불가 이유와 미정 조건</text><rect x="1190" y="415" width="345" height="125" fill="#ffffff" stroke="#adc5dd" /><rect x="1190" y="415" width="5" height="125" fill="#1169d3" /><text x="1212" y="451" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">비교 보고서 저장</text><text x="1212" y="481" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">전체 표본과 조건을 고정</text><text x="1212" y="511" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">이름과 변경 이유를 기록</text><line x1="410" y1="267" x2="440" y2="267" stroke="#557894" stroke-width="2" /><polygon points="440,267 432,262 432,272" fill="#557894" /><line x1="785" y1="267" x2="815" y2="267" stroke="#557894" stroke-width="2" /><polygon points="815,267 807,262 807,272" fill="#557894" /><line x1="1160" y1="267" x2="1190" y2="267" stroke="#557894" stroke-width="2" /><polygon points="1190,267 1182,262 1182,272" fill="#557894" /><line x1="410" y1="477" x2="440" y2="477" stroke="#557894" stroke-width="2" /><polygon points="440,477 432,472 432,482" fill="#557894" /><line x1="785" y1="477" x2="815" y2="477" stroke="#557894" stroke-width="2" /><polygon points="815,477 807,472 807,482" fill="#557894" /><line x1="1160" y1="477" x2="1190" y2="477" stroke="#557894" stroke-width="2" /><polygon points="1190,477 1182,472 1182,482" fill="#557894" /><rect x="65" y="616" width="1470" height="128" fill="#edf8f3" stroke="#adc5dd" /><rect x="65" y="616" width="5" height="128" fill="#288067" /><text x="87" y="652" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">저장 / 종료 / 다시 열기</text><text x="87" y="682" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">측정 기록, 정렬 이력, 비교 보고서를 선택해 기존 자료를 조회</text><text x="87" y="712" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">처음 적용한 개정과 원본 hash를 사용</text><line x1="1362" y1="540" x2="1362" y2="616" stroke="#557894" stroke-width="2" /><polygon points="1362,616 1357,608 1367,608" fill="#557894" /><rect x="65" y="815" width="1470" height="125" fill="#fff5e5" stroke="#adc5dd" /><rect x="65" y="815" width="5" height="125" fill="#ad6c13" /><text x="87" y="851" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:22px;font-weight:bold">오류 / 응답 불명</text><text x="87" y="881" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">사용자가 입력을 고쳐 다시 검토하거나 원래 요청의 영수증을 조회</text><text x="87" y="911" fill="#20364d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">물리 정확도와 실측 수용은 실제 자료 확보 후 별도 검증</text></svg>