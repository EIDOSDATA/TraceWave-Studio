<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="800" viewBox="0 0 1420 800"><rect width="1420" height="800" fill="#f5f8fc" /><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#547797" /></marker></defs><text x="45" y="42" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:28px;font-weight:bold">PCB / CAM 작업 전환</text><text x="45" y="75" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:18px;font-weight:normal">현재 설계, 고정 출력, 가져올 원문을 구분하고 검토한 변경만 적용한다.</text><line x1="245" y1="210" x2="245" y2="252" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="245" y1="355" x2="245" y2="397" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="245" y1="500" x2="245" y2="542" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="445" y1="162" x2="497" y2="162" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="705" y1="210" x2="705" y2="252" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="705" y1="355" x2="705" y2="397" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="705" y1="500" x2="705" y2="542" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="1165" y1="210" x2="1165" y2="252" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="1165" y1="355" x2="1165" y2="397" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><line x1="1165" y1="500" x2="1165" y2="542" stroke="#547797" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="115" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="45" y="115" width="5" height="95" fill="#1169d3" /><text x="65" y="151" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">현재 설계 / 적용된 개정</text><text x="65" y="182" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">출처와 미정값, 객체 이름 유지</text><rect x="45" y="260" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="45" y="260" width="5" height="95" fill="#1169d3" /><text x="65" y="296" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">홀 / 슬롯 / 풋프린트 / 개구</text><text x="65" y="327" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">전용 폼에서 후보와 변경 목록 검토</text><rect x="45" y="405" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="45" y="405" width="5" height="95" fill="#1169d3" /><text x="65" y="441" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">한 명령으로 적용</text><text x="65" y="472" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">undo / redo와 선택 동기화</text><rect x="505" y="115" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="505" y="115" width="5" height="95" fill="#1169d3" /><text x="525" y="151" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">출력 입력 고정</text><text x="525" y="182" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">현재 또는 보존 snapshot 선택</text><rect x="505" y="260" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="505" y="260" width="5" height="95" fill="#1169d3" /><text x="525" y="296" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">KiCad / Gerber / 드릴 / Job</text><text x="525" y="327" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">원본-대상 대응과 실제 포함 범위 검토</text><rect x="505" y="405" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="505" y="405" width="5" height="95" fill="#1169d3" /><text x="525" y="441" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">별도 worker 출력</text><text x="525" y="472" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">원문 sidecar + 파일 재읽기 보고서</text><rect x="505" y="550" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="505" y="550" width="5" height="95" fill="#1169d3" /><text x="525" y="586" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">보존 파일의 새 재검수</text><text x="525" y="617" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">원래 파일 / 보고서는 수정하지 않음</text><rect x="965" y="115" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="965" y="115" width="5" height="95" fill="#1169d3" /><text x="985" y="151" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">가져올 원문 파일 선택</text><text x="985" y="182" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">파일명 / bytes / hash와 전송 진행</text><rect x="965" y="260" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="965" y="260" width="5" height="95" fill="#1169d3" /><text x="985" y="296" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">원문 봉인 / 별도 parser</text><text x="985" y="327" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">조회 실패나 중단에도 원문 보존</text><rect x="965" y="405" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="965" y="405" width="5" height="95" fill="#1169d3" /><text x="985" y="441" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">층 / net 대응 + 손실 확인</text><text x="985" y="472" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">후보와 현재 설계를 나란히 검토</text><rect x="965" y="550" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="965" y="550" width="5" height="95" fill="#1169d3" /><text x="985" y="586" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">검토한 후보 한 번 적용</text><text x="985" y="617" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">원문 출처 / 역명령 / 영수증 보존</text><rect x="45" y="550" width="400" height="95" rx="5" fill="#ffffff" stroke="#b9cce0" /><rect x="45" y="550" width="5" height="95" fill="#1169d3" /><text x="65" y="586" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:20px;font-weight:bold">저장 / 종료 / 재열기</text><text x="65" y="617" fill="#263d55" style="font-family:Malgun Gothic,sans-serif;font-size:16px;font-weight:normal">원문과 보존 결과를 다시 조회</text><rect x="45" y="680" width="1320" height="82" rx="4" fill="#fff5e4" stroke="#e2bf7b" /><text x="65" y="711" fill="#87530d" style="font-family:Malgun Gothic,sans-serif;font-size:19px;font-weight:bold">실패 / 결과 불명: 현재 원본 유지, 원래 요청의 영수증과 작업 상태 조회</text><text x="65" y="742" fill="#87530d" style="font-family:Malgun Gothic,sans-serif;font-size:17px;font-weight:normal">새 키로 자동 반복하지 않음. 파일 생성 / 형식 검수 / 수신 도구 검사 / 제작·실측 검증은 별도 상태.</text></svg>